services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: wdk_agent
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - recipient_memory_postgres:/var/lib/postgresql/data
      - ./docker/init/001-recipient-app.sql:/docker-entrypoint-initdb.d/001-recipient-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wdk_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880" # WebSocket/RTC signaling (TCP)
      - "127.0.0.1:7881:7881/udp" # RTC media (UDP)
      - "127.0.0.1:60000-60100:60000-60100/udp" # RTC media range
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 12
  # Local full-stack dev experience: one `docker compose --profile dev up`
  # starts Postgres + the API. Kept behind `profiles: [dev]` so the CI/tests
  # command `docker compose up -d db` keeps starting only the database.
  backend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bake the recipient-memory embedding model into the image:
        #   EMBED_MODEL_PREFETCH=1 docker compose --profile dev up -d --build
        EMBED_MODEL_PREFETCH: "${EMBED_MODEL_PREFETCH:-0}"
    # Live voice / provider secrets (LIVEKIT_*, OPENAI_*, binding keys) come
    # from the git-ignored root .env; the explicit environment below
    # overrides anything it sets for the local stack (DB, fixture mode).
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgresql://postgres@db:5432/wdk_agent?options=-csearch_path%3Dpublic,extensions"
      DEMO_USER_ID: "00000000-0000-4000-8000-000000000001"
      WDK_TOOLS_SOURCE: "fixture"
      WDK_NETWORK: "sepolia"
      WDK_TOKEN: "USDT"
      RECIPIENT_MEMORY_ENABLED: "true"
      RECIPIENT_MEMORY_SEED_FILE: "examples/recipient-memory.seed.json"
      LIVE_VOICE_ENABLED: "true"
      AGENT_RUNTIME: "${AGENT_RUNTIME:-llm}"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY:-}"
      # Sign room tokens against the self-hosted server over the compose
      # network; LIVEKIT_BROWSER_URL (browser-facing URL) comes from the
      # git-ignored .env and must stay ws://localhost:7880 so the browser
      # connects to the loopback-published livekit service.
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_BROWSER_URL: "${LIVEKIT_BROWSER_URL:-ws://localhost:7880}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["api"]

  # LiveKit voice worker — same image, different entrypoint. Gated behind
  # `profiles: [worker]` so it is never started by the dev profile. The worker
  # reads required env from the shell and fails closed (throws at startup) if
  # any required value is absent.
  voice-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EMBED_MODEL_PREFETCH: "${EMBED_MODEL_PREFETCH:-0}"
    # Same contract as backend: secrets from git-ignored .env; explicit
    # environment wins for the local DB and fixture wallet mode.
    env_file:
      - .env
    environment:
      # Register with the self-hosted server over the compose network.
      # LIVEKIT_API_KEY/SECRET, binding keys and OPENAI_API_KEY also come
      # from the git-ignored .env via env_file.
      LIVEKIT_URL: "ws://livekit:7880"
    depends_on:
      db:
        condition: service_healthy
    command: ["worker"]

volumes:
  recipient_memory_postgres:
