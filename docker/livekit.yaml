# Self-hosted LiveKit for local development. Privacy-auditable by construction:
# no egress, no recording, and no webhook sections exist in this file — audio
# stays on loopback (LLS-001/LLS-009).
port: 7880
rtc:
  # Single small UDP mux range for local development media.
  # NOTE: `port_range_start/end` keys are NOT honored by v1.13.6 (verified
  # against the server log: Start/End stayed 0); the honored key is
  # rtc.udp_port as a "start-end" string.
  udp_port: "7881-7891"
  # Loopback demo topology: advertise 127.0.0.1 so the HOST browser can
  # reach the published media ports. Container clients (voice-worker) still
  # use the interface host candidates (172.x), so both paths work.
  # No TURN, no TCP relay override, no egress.
  use_external_ip: false
  node_ip: "127.0.0.1"
  # Also advertise the container interface IP so the voice-worker (on the
  # compose network) keeps its host-candidate path to media.
  advertise_internal_ip: true
  tcp_port: 7881 # ICE-TCP fallback for the browser; published on loopback only
# Credentials: livekit-server does not expand ${VAR} inside its config file
# (verified against v1.13.6), so the key/secret pair is injected by the compose
# service via LIVEKIT_KEYS using the same .env credentials the API and worker
# use. No secret is ever stored in this tracked file.
# No webhook config, no egress section, no recording section. Their absence is
# the auditable privacy guarantee.
